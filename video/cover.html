<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NuovaDev reel cover</title>
<style>
@font-face{font-family:'Poppins';font-weight:800;src:url(assets/fonts/poppins-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JB';font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0b0e13;color:#fff;font-family:Inter}
.bg{position:absolute;inset:0;background:radial-gradient(70% 40% at 85% 22%,rgba(240,86,46,.30),transparent 70%),radial-gradient(70% 40% at 10% 85%,rgba(255,154,61,.14),transparent 70%)}
/* Everything sits inside the centre 3:4 crop (y 240–1680) that the profile grid shows. */
.logo{position:absolute;top:330px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:20px;font:800 56px Poppins;letter-spacing:-0.03em}
.g{background:linear-gradient(100deg,#f0562e,#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent}
.eb{position:absolute;top:560px;left:90px;font:500 28px JB;letter-spacing:.16em;color:#ff9a3d}
h1{position:absolute;top:620px;left:90px;right:90px;font:800 124px Poppins;line-height:1.02;letter-spacing:-0.035em}
.sub{position:absolute;top:1300px;left:90px;font:500 50px Inter;color:#9aa3b2}
.sub b{color:#fff;font-weight:500}
</style>
</head>
<body>
<div class="bg"></div>
<div class="logo"><img src="assets/logo-mark-dark.png" style="width:90px;height:70px"><span>Nuova<span class="g">Dev</span></span></div>
<div class="eb">THE 9:47 PM ENQUIRY</div>
<h1>Missed enquiries aren't a <span class="g">hiring problem.</span></h1>
<div class="sub">They're a <b>systems problem.</b></div>
</body>
</html>
